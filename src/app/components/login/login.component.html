<main class="flex-1 bg-white">
  <div class="bg-white shadow-md rounded-lg p-8 w-full">
    <div class="flex flex-col md:flex-row">
      <div class="md:w-2/3 ml-9 ">
        <img src="/assets/image29.png" alt="Grupo de personas" class="rounded-lg">
      </div>
      <div class="md:w-1/2 md:pl-8 mt-8 md:mt-0 relative">
        <!-- Desplazamiento hacia abajo -->
        <div class="relative top-20">
          <h2 class="text-xl mb-4 text-center font-bold">Inicia sesión para continuar al Sistema de Gestión del Proyecto
            Ayudante de Cátedra</h2>
          <p class="text-gray-600 mb-6 font-semibold text-center md:text-left">PERIODO {{ activePeriod?.name || 'PERÍODO' }}</p>


          <!-- Indicador de carga -->
          <div *ngIf="loading" class="flex justify-center mb-4">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10"></div>
            <span class="text-customBlue font-bold ml-2 "> Iniciando sesión...</span>
          </div>
          <br>

          <form [formGroup]="loginForm" class="flex flex-col items-center">
            <div class="mb-4 w-full flex justify-center">
              <button class="w-full bg-customBlue hover:bg-customBlueHover text-white py-3 rounded-lg" (click)="loginWithGoogle()" [disabled]="loading">
                Iniciar Sesión con Google
              </button>
            </div>
            <div class="mb-4 w-full flex justify-center">
              <button class="w-full bg-customBlue hover:bg-customBlueHover text-white py-3 rounded-lg" (click)="login()" [disabled]="loading">
                Iniciar Sesión con Microsoft
              </button>
            </div>

            <p *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 text-center" role="alert">
              <strong class="font-bold">Error: </strong>
              <span class="block sm:inline">{{ errorMessage }}</span>
            </p>

          </form>
        </div>
      </div>
    </div>
  </div>
</main>
