<main class="flex-1 bg-white">
  <div class="bg-white shadow-lg rounded-xl p-6 w-full justify-end">
    <div class="flex flex-row gap-10 ">
      <!-- Imagen -->
      <div class="w-2/5 ml-14">
        <img src="/assets/image29.png" alt="Grupo de personas" class="rounded-lg shadow-md w-full">
      </div>

      <!-- Contenido -->
      <div class="w-4/5 flex flex-col justify-center text-center">
        <h2 class="text-lg font-semibold text-gray-800 mb-2">
          Inicia sesión para continuar al Sistema de Gestión del Proyecto Ayudante de Cátedra
        </h2>
        <p class="text-gray-600 text-sm mb-4 font-medium">
          PERIODO {{ activePeriod?.name || 'PERÍODO' }}
        </p>

        <!-- Indicador de carga -->
        <div *ngIf="loading" class="flex justify-center items-center mb-3">
          <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-300 h-8 w-8"></div>
          <span class="text-customBlue font-medium ml-2 text-sm">Iniciando sesión...</span>
        </div>

        <form [formGroup]="loginForm" class="flex flex-col items-center">
          <!--button class="w-1/2 bg-customBlue hover:bg-customBlueHover text-white py-2 rounded-lg transition-all duration-300 text-sm mb-3" 
                  (click)="loginWithGoogle()" [disabled]="loading">
            Iniciar Sesión con Google
          </button>
          
          <button class="w-1/2 bg-customBlue hover:bg-customBlueHover text-white py-2 rounded-lg transition-all duration-300 text-sm" 
                  (click)="loginWithMicrosoft()" [disabled]="loading">
            Iniciar Sesión con Microsoft
          </button-->

          <div class="login">
            <label for="email">Email: </label>
            <input class="input" type="text" id="email" formControlName="email" />

            <label for="password">Contraseña: </label>
            <input class="input" type="password" id="password" formControlName="password" />
          </div>

          <button
            class="w-1/2 bg-customBlue hover:bg-customBlueHover text-white py-2 rounded-lg transition-all duration-300 text-sm mb-3" 
            (click)="loginWithEmail()"
            [disabled]="loading"
          >
              Iniciar Sesión con Email
          </button>

          <button
            class="w-1/2 bg-customBlue hover:bg-customBlueHover text-white py-2 rounded-lg transition-all duration-300 text-sm mb-3" 
            routerLink="/register"
            [disabled]="loading"
          >
              Registrate
          </button>

          <p *ngIf="errorMessage" class="bg-red-100 border border-red-400 text-red-700 px-3 py-2 rounded-md mt-3 text-xs text-center" role="alert">
            <strong class="font-bold">Error: </strong>
            <span class="block sm:inline">{{ errorMessage }}</span>
          </p>
        </form>
      </div>
    </div>
  </div>
</main>
