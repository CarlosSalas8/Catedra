<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-screen overflow-auto">
    <app-navbar-directors> </app-navbar-directors>
    <app-aside-directors> </app-aside-directors>
    <div class="p-4 sm:ml-20">
        <div class="p-4 mt-14">
            <div class="flex flex-col items-center justify-center h-full w-full">
                <div class="container mx-auto bg-white flex flex-col justify-center">
                    <h2 class="text-xl font-semibold text-black mb-4 text-center" style="font-size: 22px;">Listado de Docentes</h2>
                    <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
                        <table class="w-full text-sm text-left text-gray-500 mt-8">
                            <thead class="text-xs text-black uppercase bg-gray-50">
                                <tr>
                                    <th scope="col" class="px-6 py-3">DOCENTE</th>
                                    <th scope="col" class="px-6 py-3">CONTACTO</th>
                                    <th scope="col" class="px-6 py-3">ASIGNATURA</th>
                                    <th scope="col" class="px-6 py-3">PARALELO</th>
                                    <th scope="col" class="px-6 py-3">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr *ngFor="let docente of docentes$ | async" class="bg-white border-b hover:bg-gray-50 dark:hover:bg-gray-100">
                                    <td class="px-6 py-4">{{ docente.name }}</td>
                                    <td class="px-6 py-4">{{ docente.email }}</td>
                                    <td class="px-6 py-4">{{ docente.subject }}</td>
                                    <td class="px-6 py-4">{{ docente.parallel }}</td>
                                    <td class="px-6 py-4">
                                        <a [routerLink]="['/seguimiento-docente',docente.email ]" class="text-customBlueHover hover:underline">Ver planificación</a>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
