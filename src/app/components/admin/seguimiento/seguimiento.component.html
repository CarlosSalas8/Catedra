<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-screen overflow-auto">
  
  <app-navbar-admin> </app-navbar-admin>
  
  <app-aside-admin> </app-aside-admin>


  <div class="p-4 sm:ml-20">
    <div class="p-4 mt-14">
      <div class="container mx-auto p-6 bg-white overflow-hidden flex flex-col justify-center max-h-full">
        <h2 class="text-xl font-semibold text-black mb-4 text-center" style="font-size: 22px;">Seguimiento de actividades</h2>
        
        <div class="relative overflow-x-auto shadow-md sm:rounded-lg">
          <div class="flex items-center">
            <span class="bg-gray-300 px-10 p-3 border border-gray-300 border-r-0 rounded-l-lg font-semibold">Buscar</span>
            <input type="text" class="p-3 border border-gray-300 rounded-r-lg w-full" placeholder="Nombre del tutor">
          </div>
          <table class="w-full text-sm text-left text-gray-500 mt-8">
            <thead class="text-xs text-black uppercase bg-gray-50  ">
              <tr>
                <th scope="col" class="px-6 py-3">Nombre y Apellido Tutor</th>
                <th scope="col" class="px-6 py-3">Facultad</th>
                <th scope="col" class="px-6 py-3">Carrera</th>
                <th scope="col" class="px-6 py-3">Asignatura</th>
                <th scope="col" class="px-6 py-3">Plan docente</th>
                <th scope="col" class="px-6 py-3">Acción</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let director of directors$ | async" class="bg-white border-b hover:bg-gray-50 dark:hover:bg-gray-100 ">
                <td class="px-6 py-4">{{ director.name }}</td>
                <td class="px-6 py-4">{{ director.faculty }}</td>
                <td class="px-6 py-4">{{ director.career }}</td>
                <td class="px-6 py-4">{{ director.subject }}</td>
                <td class="px-6 py-4"><a href="#" class="text-customBlueHover hover:underline">VER</a></td>
                <td class="px-6 py-4">
                  <a class="text-customBlueHover hover:underline">Ver planificación</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
  
</body>

</html>
